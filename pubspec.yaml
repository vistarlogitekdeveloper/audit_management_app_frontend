name: audit_management_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter

   # State Management
  flutter_riverpod: ^2.5.1

   # Routing
  go_router: ^14.2.0

   # Network
  dio: ^5.4.0

   # Local DB (Offline)
  drift: ^2.17.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

   # JSON & Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

   # Connectivity
  connectivity_plus: ^6.0.3

   # Background Sync
  workmanager: ^0.9.0+3

   # Secure Storage
  flutter_secure_storage: ^9.0.0



  
  cupertino_icons: ^1.0.8
  uuid: ^4.5.3
  image_picker: ^1.2.1
  riverpod_annotation: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.9.0
  drift_dev: ^2.17.0
  riverpod_generator: ^2.4.0
  
  flutter_lints: ^6.0.0


