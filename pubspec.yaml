name: audit_management_app_frontend
description: "Vistar Audit - Audit Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.4.3
  http: ^1.2.0
  http_parser: ^4.0.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  fl_chart: ^0.68.0
  flutter_pdfview: ^1.3.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cupertino_icons: ^1.0.8
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.3.1
  collection: ^1.19.0
  path_provider: ^2.1.4
  shimmer: ^3.0.0
  animations: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/

# Generates Android / iOS / Windows / macOS launcher icons from a single
# source image. Run after changing the source:
#   dart run flutter_launcher_icons
# Web favicon + PWA icons under web/ are already the Vistar logo and are
# managed by hand, so they're not regenerated here.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  # iOS forbids transparent app icons. The logo PNG has a transparent
  # background, so composite it onto white to match how the asset reads
  # in the dashboard chrome.
  background_color_ios: "#FFFFFF"
  image_path: "assets/logo.png"
  windows:
    generate: true
    image_path: "assets/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logo.png"
